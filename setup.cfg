[mutmut]
# Correctness-reset Phase 7 + #23: mutate hermetic modules against their proof
# tests. RC-0/perf flakiness that once forced one-module-at-a-time runs is fixed
# (#206 registry-probe, #209 perf quarantine), so the selection can be broader.
# NOTE: gates.py is in scope but NOT yet mutation-closed — a 2026-07-28 run showed
# 255 mutants: 122 killed, 103 survived, 30 no-test. The survivors are real gaps in
# _check_syntax/_check_citation/_check_format (not exercised by the structure-gate
# tests) plus equivalents; closing them is a queued test-writing campaign (Gate 13).
source_paths=src/chuzom
           bench
only_mutate=src/chuzom/execution_ledger.py
           src/chuzom/execution_signal.py
           src/chuzom/operational_signal.py
           src/chuzom/context_signal.py
           src/chuzom/gates.py
           bench/savings.py
also_copy=tests
pytest_add_cli_args_test_selection=tests/test_execution_ledger.py
                                   tests/test_execution_signal.py
                                   tests/test_operational_signal.py
                                   tests/test_context_signal.py
                                   tests/test_contract_gates.py
                                   tests/test_chz_aud_014.py
                                   tests/test_bench_savings.py
