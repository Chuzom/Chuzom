[mutmut]
# Correctness-reset Phase 7: scope mutation testing to hermetic modules only.
# The full suite has known load-induced/RC-0 flakiness, so we mutate one module
# at a time against its hermetic proof tests. Copy the whole package + tests so
# conftest's imports resolve in mutmut's mutants/ sandbox, but only MUTATE the
# canonical ledger.
source_paths=src/chuzom
only_mutate=src/chuzom/execution_ledger.py
also_copy=tests
pytest_add_cli_args_test_selection=tests/test_execution_ledger.py
