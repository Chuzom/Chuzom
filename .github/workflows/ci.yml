name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_HTTP_TIMEOUT: 30

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      # Pinned ruff version → CI lint is reproducible and won't drift when ruff
      # ships new rules. The rule set is curated in pyproject [tool.ruff.lint].
      - run: uvx ruff@0.16.0 check src/ tests/
      - name: Capability-claim guard (no new unbacked marketing claims)
        run: bash scripts/lint_capability_claims.sh
      - name: Claim-evidence registry (INV-CLAIM-001..004)
        run: uv run python scripts/validate_claim_evidence.py
      - name: Tool-surface guard (CHZ-SURF-01 — no unroutable tool names)
        # A hint naming an unregistered tool fails with "No such tool available",
        # after which the caller silently pays full model price. That outcome is
        # INDISTINGUISHABLE from "chose not to route" in every metric we have,
        # so it can only be caught statically.
        run: uv run python scripts/lint_tool_surface.py

      - name: "Fail-open guard (CHZ-FO-01 — no SILENT broad catch where money is)"
        # RED8-09. ~810 broad `except Exception` handlers exist and most are
        # correct: a UserPromptSubmit hook that raises kills the user's turn, and
        # a telemetry write that raises turns observability into an outage.
        # Removing them would trade a known degradation for a crash.
        #
        # The defect is the SILENCE. A handler ending in bare `pass` is
        # indistinguishable from the happy path in every surface we have — the
        # same shape as the ledger drop that looked like no traffic and the
        # savings query failure that rendered "$0.00 saved". This bans catches
        # that leave NO TRACE, only in the five modules where a silent
        # degradation mis-reports money or changes a routing decision.
        #
        # Zero tolerance, no baseline: WP-13's criterion names those modules
        # explicitly, so a baseline would list exactly the places that must be
        # empty.
        run: uv run python scripts/lint_fail_open.py

      - name: "Savings-sign guard (CHZ-SS-01 — no clamped net in a money module)"
        # AUD-06: "TOTAL saved is a sum of wins, not a net — losses clamped to
        # zero before aggregation." WP-04/WP-05 fixed ONE site
        # (hooks/session-end.py) and pinned it with a test that loads that one
        # file. ELEVEN other surfaces kept the clamp, including
        # cost.get_team_savings — which team.py broadcasts to Slack/Discord —
        # and the dashboard's `net_saved = max(0, gross - overhead)`, AUD-06's
        # own sentence in code.
        #
        # 13_HISTORICAL_DEFECT_PATTERNS.md records the $15/$75 price bug being
        # fixed locally FOUR times and returning every time, "because no fix was
        # ever made structural". Eleven point-fixes would have been the fifth.
        #
        # Its blind spots are stated in the script: it matches an inline
        # `max(0, …)` on a savings-named quantity, so a clamp split across two
        # lines, an `if x < 0: x = 0`, or one inside a helper it never reads all
        # escape. A pass means "no clamped net is spelled inline in these
        # modules" — NOT "no surface hides a loss".
        run: uv run python scripts/lint_savings_sign.py

      - name: "G-C: acceptance criteria unchanged (the executor cannot edit its own oracle)"
        # The remediation plan says criteria are hashed before a run and
        # re-verified after, and G-C makes a mismatch a disqualifier. No hash was
        # ever computed, so G-C could not fire — the same defect as
        # unregistered() and lint_tool_surface.py: check-shaped, reporting
        # nothing, counted as protection.
        #
        # Deliberately over-reports: it hashes whole files, not criteria blocks,
        # so unrelated prose edits trip it and must be re-baselined on purpose. A
        # block parser could silently narrow coverage instead, which is the
        # under-reporting failure the env-registry scanner already demonstrated.
        run: uv run python scripts/verify_criteria_hashes.py

      - name: "North-star trace (RED1-23 — the hook→server seam, end to end)"
        # The lint above is STATIC and, by its own docstring, checks that no
        # emitter hardcodes a tool name into prose. It cannot see the seam where
        # the shipped bug lived: the hook's idea of the tool surface versus the
        # server's actual registration, which are separate processes that never
        # compared notes. This script runs the REAL hook and resolves tools from
        # the REAL server object.
        #
        # It existed and was referenced by a CHANGELOG line and nothing else —
        # not by CI, not by doctor. A guard nobody invokes is documentation.
        #
        # It also needed hardening before it was worth invoking: "every hint
        # names a registered tool" is necessary but not sufficient. With a bogus
        # name in CORE_TOOLS the server simply cannot register it, the tier
        # silently shrinks 4→3, and the fallback chain degrades llm_query hints
        # to llm_code — every hint still valid, query prompts routed to the code
        # tool, trace reporting CLEAN. It now also asserts the reverse direction:
        # every tool a tier DECLARES must actually be registered.
        run: uv run python scripts/trace_northstar.py

      - name: Pricing guard (INV-COST-004 — one source of truth for money)
        # Same failure shape as the tool-surface guard above: a wrong price
        # produces a plausible number, not an error, so nothing downstream can
        # notice. The audit found the retired Opus 3 rate ($15/$75, 3x the real
        # one) in five tables; this lint found thirteen. Baselined as accepted
        # debt that may shrink but never grow — a NEW price table fails the build.
        run: uv run python scripts/lint_pricing.py

      - name: Model registry freshness (WP-12 — the ladder is curated, not live)
        # NORTH_STAR called the capability ranking "live" and
        # "continuously-updated". It is a hand-edited YAML snapshot; nothing
        # fetches a ranking at runtime. The file header even told readers to
        # refresh via scripts/refresh-model-registry.py — which does not exist
        # and never did, so the documented cadence had no mechanism behind it.
        #
        # A stale ladder pins escalation to a previous model generation: the
        # "fixed vendor ranking" the North Star names as a violation, arrived at
        # by neglect rather than decision. Enforced here so staleness is a red
        # build instead of a quietly wrong routing decision.
        run: uv run python scripts/check_model_registry_freshness.py

      - name: Workflow shell portability (a `run:` block must mean one thing)
        # All three windows legs of PR #253 were red on a quoting bug in
        # smoke-test.yml, not on a product defect. `run:` is bash on
        # ubuntu/macos and pwsh on windows; bash collapses \" to " and pwsh
        # does not, so the same inline Python was valid on every platform the
        # developer could reach and a SyntaxError on the one they could not.
        #
        # 30_CI_GAP_PLAN §6 named three suspects for those failures and all
        # three were wrong -- an unreproducible failure invites speculative
        # fixes, and this lint is the alternative to guessing. Verified by
        # control against the pre-fix tree: it reports exactly the two lines
        # that broke CI.
        run: uv run python scripts/lint_workflow_shell_portability.py

      - name: Suite env parity (both suite runs get the same environment)
        # The suite runs twice on purpose — source tree here, built wheel in
        # G-D — so they differ in what they test and must not differ in what
        # the suite needs to run at all. They did: this job set a dummy
        # OPENAI_API_KEY and G-D never got it, so G-D failed with 41
        # `No providers available` errors that had nothing to do with
        # packaging. A gate red for a reason unrelated to what it gates is a
        # gate people learn to skip.
        run: uv run python scripts/lint_suite_env_parity.py

  quality-gates:
    # v1.0.1 mitigation gates (G4/G5/G6). These target the audit's recurrence
    # patterns directly: new can't-fail tests (G4), regressions of the six fixed
    # criticals (G5), and fabricated marketing claims (G6). G1 (fresh-resolver
    # install + MCP start) lives in publish-pypi.yml at the release boundary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: "G2: multi-turn soak — routing must not decay (CHZ-EXT-201)"
        run: uv run pytest -q -o addopts="" tests/test_g2_soak_no_decay.py
      - name: "G3: realization telemetry complete end-to-end (CHZ-EXT-204)"
        run: uv run pytest -q tests/test_g3_realization_soak.py
      - name: "G7: realized-savings soak — a defensible number exists (Phase 0)"
        run: uv run pytest -q tests/soak/realized_savings_soak.py

      - name: "G7: …and a LOSS survives every layer (WP-16 item 1)"
        # "A defensible number exists" is satisfied by a clamped zero, which is
        # how Gate 7 certified a release carrying AUD-06 — the max(0.0, …) clamp
        # that rendered overspend as "$0.00 saved". The gate asked whether a
        # figure was produced, never whether an UNFAVOURABLE one could survive
        # being produced.
        #
        # test_savings_sign.py (WP-04, immutable) pins the source arithmetic.
        # This pins the rest of the chain — statistics, cross-run aggregator,
        # the savings_claim_supported label, and the printer — because a signed
        # subtraction feeding a clamped mean is still a lie to the operator.
        #
        # Each assertion was verified to FIRE by injecting an AUD-06-style clamp
        # at its layer; all five injections turn this red. See
        # evidence/wp16_gate7_loss.md.
        run: uv run pytest -q tests/soak/test_gate7_loss_representable.py
      - name: "G4: test-hygiene ratchet (no new SWALLOWED-EXCEPTION tests)"
        # Renamed from "(no new can't-fail tests)". The script is honest about
        # itself -- it counts except-handlers whose body is pass/.../continue --
        # but the step NAME generalised that to the whole class, and a reader
        # concluding "can't-fail tests are covered" would be wrong.
        #
        # A swallowed exception is ONE way a test cannot fail. Others this gate
        # structurally cannot see, all found in this remediation:
        #   * a tautological assertion (`assert quota >= 0` on a sum of counts,
        #     inside Gate 7 itself),
        #   * an assertion on logic RE-IMPLEMENTED in the test body rather than
        #     imported (my own first draft of the Gate 7 loss tests),
        #   * a scan that silently returns nothing, making every later assertion
        #     vacuous.
        # Naming the gate for what it measures is cheaper than the alternative,
        # which is a release note that overstates what was checked.
        run: bash scripts/quality_gate_test_hygiene.sh
      - name: "G5: audit regression suite (the six fixed criticals + follow-ons)"
        run: >
          uv run pytest -q
          tests/test_sec07_statusline_injection.py
          tests/test_ext201_routing_latch.py
          tests/test_ext204_realization_telemetry.py
          tests/test_st001_st003_isolation_failopen.py
          tests/test_st004_semantic_cache_project_scope.py
          tests/test_sec01_shared_scrubber.py
          tests/test_sec03_env_allowlist.py
          tests/test_sec06_ollama_url_ssrf.py
          tests/test_pkg_python_and_install.py
          tests/test_py004_aiosqlite_daemon.py
          tests/test_sec05_dashboard_token.py
          tests/test_sec04_local_server_origin_guard.py
          tests/test_tq007_daily_cap_downgrade.py
          tests/test_draft01_no_block_outside_zero_claude.py
          tests/test_red2_04_privacy_local_blocks_all_external.py
          tests/test_red1_09_budget_lock_cross_thread.py
          tests/test_red1_0506_routeid_and_dedup.py
          tests/test_red1_08_cap_sees_rejected_attempts.py
          tests/test_red1_07_spend_boundary_consistency.py
          tests/test_red2_02_downgrade_observable.py
          tests/test_red2_03_shell_installer_backup.py
          tests/test_red1_2_03_routeid_nonce.py
          tests/test_red2_2_02_downgrade_rendered.py
          tests/test_iter3_tier_a.py
          tests/test_red1_3_reservation_leaks.py
      - name: "G6: no fabricated marketing claims (pyproject + README)"
        run: uv run pytest -q tests/test_claims_no_fabricated_magnitudes.py

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      - name: Verify version sync
        run: uv run python scripts/verify-version-sync.py

  plugin-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      - name: Verify plugin distribution sync
        run: python scripts/verify-plugin-sync.py

  routing-hermetic:
    # Runs the routing suites tagged `routing_hermetic` (see
    # tests/conftest.py::_ROUTING_HERMETIC_FILES) as a standalone unit.
    # DELIBERATELY no API keys and no ~/.chuzom state: the autouse
    # `_hermetic_host_state` fixture guarantees these tests see an empty
    # repo config and codex/gemini-unavailable, and this job proves that
    # guarantee holds on a bare runner — catching any new test that
    # silently leans on a developer's local routing.yaml pins or CLIs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run hermetic routing unit
        run: uv run pytest -m routing_hermetic -q --timeout=30

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        shell: bash
        env:
          # A routing-audit fix made _build_and_filter_chain correctly filter
          # out providers that aren't actually available (codex/ollama/gemini_cli/
          # subscription-anthropic used to survive the filter unconditionally —
          # a real bug: a runner with none of them configured could still see
          # phantom, undispatchable models in its chain). Many pre-existing
          # tests here (RBAC, deadlines, cancel-shield, enterprise enforcement)
          # don't care which provider they route to — they patch the dispatch
          # layer itself — but implicitly relied on that bug to get ANY
          # candidate into the chain on this bare runner (no real API keys, no
          # Ollama). A dummy key is enough: these tests never make a real
          # network call, they just need available_providers non-empty.
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-only-no-real-calls-made
        run: |
          # Run pytest in the background so we can detect the aiosqlite thread hang.
          # pytest writes junit xml before the hang; we read that to determine pass/fail.
          # NOTE: do NOT add --cov here. Coverage instrumentation slows the
          # full suite past the watchdog below, so pytest never writes
          # junit before the timeout fires → "Could not read junit xml". Run
          # coverage in a separate, unwrapped job if/when it's needed (N1).
          uv run pytest tests/ -q \
            --ignore=tests/test_agno_integration.py \
            --timeout=30 \
            --junit-xml=/tmp/pytest-results.xml &
          PYTEST_PID=$!

          # Wait for pytest to exit normally. The full suite is ~150s locally,
          # but the slowest CI runner (3.11) under a GitHub cache-service outage
          # has been observed >280s while still ACTIVELY RUNNING (not exit-hung).
          # 540s leaves ample margin under the 10m job timeout so the watchdog
          # only fires on a real aiosqlite exit-hang, not a merely-slow run.
          for i in $(seq 1 540); do
            if ! kill -0 $PYTEST_PID 2>/dev/null; then
              wait $PYTEST_PID
              exit $?
            fi
            sleep 1
          done

          # Still running after the wait. This is a REAL exit-hang ONLY if pytest
          # already finished the tests (junit written); if junit is absent the
          # process was still running (a false hang from a slow runner) — surface
          # that distinctly instead of masking it as a test failure.
          if [ ! -f /tmp/pytest-results.xml ]; then
            echo "::error::pytest still running after 540s with no junit — slow runner, not a hang. Re-run."
            kill $PYTEST_PID 2>/dev/null || true
            exit 1
          fi
          echo "pytest is hanging on exit — reading junit results..."
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("/tmp/pytest-results.xml").getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              failures = int(suite.get("failures", 0))
              errors   = int(suite.get("errors",   0))
              tests    = int(suite.get("tests",     0))
              print(f"junit: {tests} tests, {failures} failures, {errors} errors")
              sys.exit(1 if (failures or errors) else 0)
          except Exception as e:
              print(f"Could not read junit xml: {e}")
              sys.exit(1)
          PY
          result=$?
          kill $PYTEST_PID 2>/dev/null || true
          exit $result

  postgres-budget:
    # P1-5: run the real-Postgres multi-instance budget acceptance test
    # (100 concurrent try_reserve across 4 processes against a $5 cap → exactly
    # 50 succeed). The default `test` job skips it via importorskip("psycopg"),
    # so the multi-instance enforcement claim was never CI-proven. The test uses
    # testcontainers and Docker is available on ubuntu-latest, so it spins up
    # postgres:16-alpine itself — no `services:` block needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (postgres integration extra)
        run: uv sync --extra dev --extra postgres-test

      - name: Run Postgres budget acceptance test
        run: uv run pytest tests/test_t2_xl1_postgres_budget_backend.py -v
