name: Smoke Test — Fresh Install

# Verifies that a freshly installed chuzom works end-to-end across Python
# versions, operating systems, and installer tools (pip / pipx / uv).
# Each job: install → hooks → classify a prompt → verify routing response.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Package declares requires-python >=3.11; 3.10 install fails with
        # "requires a different Python" (pre-existing red matrix job, unrelated to
        # any feature work). Align the smoke matrix with the supported versions.
        python: ["3.11", "3.12", "3.13"]
        installer: [pip, uv]
        exclude:
          # pipx on Windows runners can be flaky with path resolution — use pip
          - os: windows-latest
            installer: uv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install chuzom via pip
        if: matrix.installer == 'pip'
        run: pip install -e ".[dev]"

      - name: Install chuzom via uv
        if: matrix.installer == 'uv'
        run: uv pip install -e ".[dev]" --system

      - name: Verify CLI is importable
        run: python -c "import chuzom; print('chuzom imported OK')"

      - name: Verify router config loads
        run: python -c "from chuzom.config import RouterConfig; cfg = RouterConfig(); print('RouterConfig OK')"

      - name: Verify hook classifies and routes a simple prompt
        shell: bash
        run: |
          python - <<'PY'
          import sys, json, subprocess, os
          hook = 'src/chuzom/hooks/auto-route.py'
          payload = json.dumps({'prompt': 'What is 2+2?', 'session_id': 'smoke-test'})
          env = {**os.environ, 'CHUZOM_DIRECT_EXECUTION': 'false', 'CHUZOM_DISABLE_LLM_CLASSIFIERS': '1'}
          # 60s, not 10s: a cold Windows runner spends most of the budget just
          # starting the interpreter and importing the hook. At 10s this step
          # flaked on windows-latest/py3.13 with TimeoutExpired before the hook
          # had classified anything. The job's own timeout still catches a hang.
          r = subprocess.run([sys.executable, hook], input=payload, capture_output=True, text=True, env=env, timeout=60)
          assert r.returncode == 0, f'hook exit {r.returncode}: {r.stderr}'
          output = next((l for l in r.stdout.splitlines() if l.startswith('{')), r.stdout)
          data = json.loads(output)
          assert 'decision' in data or 'hookSpecificOutput' in data, f'missing routing output: {data}'
          decision = data.get('decision', data.get('hookSpecificOutput', {}).get('hookEventName', 'route'))
          print(f'hook classified OK: decision={decision}')
          PY

      - name: Verify a research prompt routes to the research tool (not Ollama)
        shell: bash
        run: |
          python - <<'PY'
          import sys, json, subprocess, os
          hook = 'src/chuzom/hooks/auto-route.py'
          payload = json.dumps({'prompt': 'What is the latest AI news in 2026?', 'session_id': 'smoke-research'})
          env = {
              **os.environ,
              'CHUZOM_DIRECT_EXECUTION': 'false',
              'CHUZOM_DISABLE_LLM_CLASSIFIERS': '1',
          }
          # 60s, not 10s: a cold Windows runner spends most of the budget just
          # starting the interpreter and importing the hook. At 10s this step
          # flaked on windows-latest/py3.13 with TimeoutExpired before the hook
          # had classified anything. The job's own timeout still catches a hang.
          r = subprocess.run([sys.executable, hook], input=payload, capture_output=True, text=True, env=env, timeout=60)
          assert r.returncode == 0, f'hook exit {r.returncode}: {r.stderr}'
          output = next((l for l in r.stdout.splitlines() if l.startswith('{')), r.stdout)
          data = json.loads(output)
          ctx = (data.get('hookSpecificOutput') or {}).get('additionalContext', '')
          # CHZ-SURF-01: assert the tool registered under the ACTIVE tier. The
          # shipping default is `consolidated`, where the research tool is
          # llm(task="research") — asserting the raw legacy literal is what let
          # this smoke test stay green while the emitted hint was unroutable.
          from chuzom.tool_surface import route_tool
          expected = route_tool('llm_research')
          assert expected in ctx, f'research prompt did not route to {expected}. ctx={ctx[:200]}'
          print(f'research → {expected} ✓')
          PY

      - name: Verify sync chain_builder returns empty for research
        run: |
          python -c "
          from chuzom.hooks.chain_builder import build_chain
          chain = build_chain('simple', 'green', 'research')
          assert chain == [], f'Expected empty chain for research, got: {chain}'
          print('chain_builder research bypass ✓')
          "

      - name: Verify install_hooks preserves a PRE-EXISTING host config
        # WP-14: this step used to point HOME at an EMPTY temp dir, which is
        # exactly why it could not have caught RED4-01 (install destroying the
        # user's statusLine). An install that clobbers user config looks perfect
        # when there is no user config to clobber. The realistic case -- a
        # settings.json that already has a foreign statusLine and unrelated keys
        # the user cares about -- is the only one that can fail.
        #
        # NO BACKSLASH-ESCAPED QUOTES IN THIS SCRIPT. `run:` uses bash on
        # ubuntu/macos and pwsh on windows. bash turns `\"` inside a
        # double-quoted string into `"`; pwsh does not treat backslash as an
        # escape character at all, so `\"` reaches Python verbatim and the
        # interpreter dies with `SyntaxError: unterminated string literal`
        # before running a single assertion. That is the entire reason all
        # three windows legs were red on PR #253 -- a quoting bug in this file,
        # not a defect in install_hooks. Hoist values into locals instead of
        # putting `after.get("x")` inside an f-string.
        run: |
          python -c "
          import json, os, tempfile
          with tempfile.TemporaryDirectory() as tmp:
              os.environ['HOME'] = tmp
              claude_dir = os.path.join(tmp, '.claude')
              os.makedirs(claude_dir, exist_ok=True)
              settings_path = os.path.join(claude_dir, 'settings.json')
              seeded = {
                  'statusLine': {'type': 'command', 'command': '~/.local/bin/my-own-statusline'},
                  'model': 'opus',
                  'env': {'MY_OWN_VAR': 'do-not-touch'},
              }
              with open(settings_path, 'w') as fh:
                  json.dump(seeded, fh, indent=2)
              try:
                  from chuzom.install_hooks import install
                  actions = install()
                  print(f'install() returned {len(actions)} actions')
              except Exception as e:
                  # Acceptable: may fail on Windows if Git Bash absent, etc.
                  print(f'install() raised (expected on some platforms): {e}')
              with open(settings_path) as fh:
                  after = json.load(fh)
              # Keys chuzom has no business touching must survive verbatim.
              model_after = after.get('model')
              env_after = after.get('env', {})
              assert model_after == 'opus', f'install() clobbered model: {model_after}'
              assert env_after.get('MY_OWN_VAR') == 'do-not-touch', \
                  f'install() clobbered env: {env_after}'
              # The foreign statusLine may be replaced -- that is chuzom's job --
              # but it must be RECOVERABLE, not silently destroyed.
              sl = after.get('statusLine')
              if sl != seeded['statusLine']:
                  backups = [f for f in os.listdir(claude_dir) if 'settings' in f and f != 'settings.json']
                  assert backups, (
                      'install() replaced the user statusLine and left no backup: '
                      f'{os.listdir(claude_dir)}'
                  )
                  print(f'statusLine replaced, backup present: {backups}')
              else:
                  print('statusLine preserved as-is')
              print('pre-existing host config survived install ✓')
          "

  # ── Doc 34 Step 1 · B1: the documented commands against the BUILT WHEEL ────
  #
  # Every other install check here uses `pip install -e ".[dev]"` — an EDITABLE
  # install from the source tree. G-D's own header says why that proves nothing
  # about packaging: "editable installs cannot catch packaging defects at all —
  # missing package_data, modules absent from the wheel, entry points that do not
  # resolve, hook scripts not shipped."
  #
  # A user does not get an editable install. They get a wheel. So the README's
  # promises are executed against one, in a venv with NO source tree on the path,
  # which is the closest thing to a real `pip install chuzom-router` that can run
  # before the package is published.
  #
  # This is the stage doc 35 §5 calls the weakest, and the reason is honest: a
  # GitHub runner is clean in ways a local container is not (no credentials, no
  # ~/.chuzom, no cache), but it still is not a user's machine. It proves the
  # wheel is self-sufficient, not that every environment will work.
  docs-commands-wheel:
    name: Doc commands · built wheel · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel into a venv with no source tree
        run: |
          uv venv .wheelenv --python ${{ matrix.python }}
          uv pip install --python .wheelenv/bin/python dist/*.whl

      - name: Confirm chuzom resolves from site-packages, not src/
        # Without this the step below would silently degrade into a source-tree
        # run the moment anything put src/ back on the path — the exact false
        # green G-D was created to close.
        run: |
          .wheelenv/bin/python - <<'PY'
          import pathlib, sys, chuzom
          p = pathlib.Path(chuzom.__file__).resolve()
          print("chuzom resolved from:", p)
          if "site-packages" not in p.parts:
              sys.exit(f"FAIL: resolved from the source tree, not the wheel: {p}")
          PY

      - name: Run every documented command against the wheel
        shell: bash
        env:
          # The installed console script must be what runs, not a source copy.
          PATH: ${{ github.workspace }}/.wheelenv/bin:${{ env.PATH }}
        run: |
          python -m pip install --quiet --upgrade pip >/dev/null 2>&1 || true
          .wheelenv/bin/python scripts/check_docs_commands.py --run --time-budget 60

  # ── Doc 34 Step 1 · B3: the documented commands, on every platform ─────────
  #
  # The in-tree check in ci.yml runs on ubuntu only. That is the shape that let
  # the Windows failure through earlier in this audit: `\"` means one thing in
  # bash and another in pwsh, it was invisible on every platform reachable
  # locally, and it lived in a shell-quoted command of exactly the kind this
  # check executes.
  #
  # So the README's promises are executed on all three platforms and at BOTH
  # ends of the supported Python range — a documented command that only works
  # where the maintainer happens to develop is a broken promise to everyone else.
  docs-commands-matrix:
    name: Doc commands · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
      - name: Run every documented command
        shell: bash            # pinned: this step must mean the same thing everywhere
        run: uv run python scripts/check_docs_commands.py --run

  # ── G-D: the suite must be green on the BUILT WHEEL ────────────────────────
  #
  # This gate was previously unsatisfiable, and not merely unimplemented.
  # `pythonpath = ["src"]` in pyproject.toml forces chuzom to resolve from the
  # source tree regardless of which venv runs pytest, so installing a wheel and
  # running the suite still tested the source and reported green. Every green CI
  # run before this job was evidence about the editable install only.
  #
  # That setting is right for the ordinary run — without it a bare `uv run
  # pytest` on a Python lacking chuzom silently ERRORed 67 enforcement tests into
  # a false pass (CHZ-AUD-002). Two different false-greens; they need two
  # invocations rather than one compromise. This job passes `-o pythonpath=` and
  # sets CHUZOM_REQUIRE_WHEEL=1, which makes tests/conftest.py refuse to run
  # unless chuzom resolves from site-packages. Without that assertion the job
  # would degrade silently into a second source-tree run the moment anything put
  # src/ back on the path.
  #
  # Editable installs cannot catch packaging defects at all: missing
  # package_data, modules absent from the wheel, entry points that do not
  # resolve, hook scripts not shipped. src/chuzom/hooks/*.py are executed as
  # standalone scripts by path, which is exactly the shape that works in-tree
  # and breaks when packaged.
  wheel-suite:
    name: G-D · full suite on the built wheel · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Create a clean venv with NO source tree on the path
        run: uv venv .wheelvenv --python ${{ matrix.python }}

      - name: Install the built wheel plus test-only dependencies
        # The wheel carries runtime deps only, so the test toolchain is installed
        # explicitly. Installing the project itself here (even as an extra) would
        # defeat the point by pulling in the source.
        run: |
          uv pip install --python .wheelvenv/bin/python dist/*.whl
          uv pip install --python .wheelvenv/bin/python \
            pytest pytest-asyncio pytest-timeout pytest-cov \
            aiosqlite hypothesis freezegun respx

      - name: Confirm chuzom resolves from site-packages, not src/
        run: |
          .wheelvenv/bin/python - <<'PY'
          import pathlib, sys
          import chuzom
          p = pathlib.Path(chuzom.__file__).resolve()
          print("chuzom resolved from:", p)
          if "site-packages" not in p.parts:
              sys.exit(f"FAIL: resolved from the source tree, not the wheel: {p}")
          PY

      - name: Run the full suite against the wheel
        env:
          CHUZOM_REQUIRE_WHEEL: "1"
          # MUST MATCH ci.yml's `test` job. Both jobs run the SAME suite; they
          # differ only in what they run it against (source tree vs wheel). Any
          # env the suite needs is therefore needed by both, and this one was
          # set in exactly one of them.
          #
          # Without it: 41 failures across test_t3_m1/m2/m4, test_t3_s2,
          # test_t4_m1/m2 -- all `ValueError: No providers available for
          # query/budget. Configured providers: none`. Those tests patch the
          # dispatch layer and never make a network call; they just need
          # available_providers to be non-empty, which a bare runner with no
          # keys and no Ollama cannot supply. ci.yml carries the full
          # explanation and has had this since the routing-audit fix to
          # _build_and_filter_chain.
          #
          # 30_CI_GAP_PLAN §5 guessed G-D was failing for the same reason as the
          # `test` job. It was not: the suite fix landed, `test` went green on
          # all four versions, and G-D stayed red on this instead.
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-only-no-real-calls-made
        run: .wheelvenv/bin/python -m pytest -o pythonpath= -q
