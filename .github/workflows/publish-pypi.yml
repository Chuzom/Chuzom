name: Publish to PyPI

# PyPI publishing RESUMED at v1.1.1 (CHZ-SURF-01 hotfix). The pause was lifted
# deliberately: with the routing hints unroutable under the default tier, every
# install in the wild was silently paying full model price, so the fix has to reach
# users. Pushing a `v*` tag publishes; manual dispatch still works for re-runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Gate: publishing must never ship a release that fails lint (v0.10.1 shipped
  # with 7 ruff errors because this workflow didn't gate on CI). Mirrors the CI
  # lint job — same pinned ruff version so the two never diverge.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
        continue-on-error: true
        id: uv-setup
      - name: Retry uv setup
        if: steps.uv-setup.outcome == 'failure'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv python install 3.11
      # Pinned ruff version → matches ci.yml; the rule set is curated in
      # pyproject [tool.ruff.lint].
      - run: uvx ruff@0.16.0 check src/ tests/
      - name: Capability-claim guard (no new unbacked marketing claims)
        run: bash scripts/lint_capability_claims.sh

  publish:
    needs: lint
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify package contents
        run: |
          echo "=== Verifying sdist contents ==="
          tar tzf dist/*.tar.gz | grep -iE "(Dockerfile|docker-compose|\.claude-plugin|\.codex-plugin|CLAUDE\.md|SECURITY\.md)" && {
            echo "ERROR: Found excluded files in sdist"
            exit 1
          } || echo "✓ No excluded files found"
          echo ""
          echo "=== Package file list ==="
          tar tzf dist/*.tar.gz | head -20

      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "✓ Version verified: $PACKAGE_VERSION"

      # G1 (CHZ-PKG-003 gate): install the built wheel into a CLEAN venv with a
      # FRESH dependency resolution — no uv.lock, exactly a new user's `pip
      # install` against live PyPI — then import chuzom.server and start the MCP
      # server far enough to list its tools. This is precisely the check whose
      # absence let 1.0.0 ship with an unbounded `mcp>=1.0.0` that resolved to a
      # 2.0.0 which deleted mcp.server.fastmcp. If this fails, DO NOT publish.
      - name: "G1: fresh-resolver install + MCP server start"
        run: |
          set -euo pipefail
          python -m venv /tmp/g1venv
          /tmp/g1venv/bin/pip install --upgrade pip >/dev/null
          echo "=== fresh install of the built wheel (no lockfile) ==="
          /tmp/g1venv/bin/pip install dist/*.whl
          echo "=== resolved mcp version (must be 1.x, not 2.x) ==="
          /tmp/g1venv/bin/pip show mcp | grep -i '^version'
          echo "=== import chuzom.server + list MCP tools ==="
          /tmp/g1venv/bin/python - <<'PYEOF'
          import asyncio
          import chuzom.server as s  # imports mcp.server.fastmcp — crashes on mcp 2.x
          tools = asyncio.run(s.mcp.list_tools())
          assert len(tools) > 0, "MCP server registered zero tools"
          print(f"G1 PASS: chuzom.server imports and lists {len(tools)} MCP tools")
          PYEOF

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/* --skip-existing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
