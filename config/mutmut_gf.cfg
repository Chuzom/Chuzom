# G-F qualification scope — the SECOND mutmut config.
#
# NOT active by default. `scripts/gf_mutmut.py` swaps this into setup.cfg for the
# duration of one run and restores the original byte-for-byte afterwards.
#
# WHY A SWAP RATHER THAN A SECOND CONFIG FILE mutmut reads directly:
# mutmut 3.6 resolves configuration in configuration.py::_config_reader as
#   1. pyproject.toml [tool.mutmut]  -- if present, setup.cfg is IGNORED ENTIRELY
#   2. else setup.cfg [mutmut]
# There is no --config flag and no second-section support. So adding
# [tool.mutmut] to pyproject.toml — the obvious way to "add a second config" —
# would have SILENTLY DISABLED the Gate-13 scope in setup.cfg rather than
# sitting beside it. Gate 13's campaign evidence depends on that scope, and the
# breakage would have been invisible: mutmut would run happily, over the wrong
# files, and report a score.
#
# SCOPE: the eight modules G-F names (money / routing / verification). The
# Gate-13 config in setup.cfg covers a DIFFERENT six, of which only
# execution_ledger.py overlaps. Note that its `bench/savings.py` is a different
# file from `src/chuzom/savings.py`.

[mutmut]
source_paths=src/chuzom
only_mutate=src/chuzom/cost.py
           src/chuzom/savings.py
           src/chuzom/execution_ledger.py
           src/chuzom/router.py
           src/chuzom/tool_surface.py
           src/chuzom/classify.py
           src/chuzom/budget.py
           src/chuzom/coverage.py
also_copy=tests

# DELIBERATELY NO pytest_add_cli_args_test_selection.
#
# The Gate-13 config names an explicit per-module test list. That is an
# optimisation, and for G-F it would be a correctness error: naming the tests
# that "should" own a behaviour is exactly how B8 was misread as absent coverage
# when tests/test_t2_m1_budget_key.py had covered it all along.
#
# G-F asks whether THE SUITE catches a defect, not whether a nominated subset
# does. mutmut 3.x already selects covering tests per mutant, so leaving this
# unset is both more accurate and — measured at ~0.33s/mutant — affordable.
